spring.application.name=ledger-service
server.port=8081
spring.threads.virtual.enabled=true
server.shutdown=graceful
server.mime-mappings.yaml=application/yaml
spring.lifecycle.timeout-per-shutdown-phase=10s
spring.mvc.problemdetails.enabled=true

# Compose default; local runs set POC_TIGERBEETLE_ADDRESSES=127.0.0.1:3000
poc.tigerbeetle.cluster-id=0
poc.tigerbeetle.addresses=tigerbeetle:3000
poc.tigerbeetle.request-deadline=800ms
poc.tigerbeetle.ledger=1
poc.posting.max-legs=8
poc.posting.concurrency-limit=1024
poc.accounts.bootstrap=true
poc.accounts.bootstrap-timeout=60s
poc.accounts.bootstrap-retry-interval=1s

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# Readiness = TigerBeetle reachable; liveness never depends on TigerBeetle (D28)
management.endpoint.health.group.readiness.include=readinessState,tigerbeetle
management.endpoint.health.group.liveness.include=livenessState
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.[ledger_posting_duration]=true
management.metrics.distribution.percentiles-histogram.[ledger_tb_request]=true
management.metrics.distribution.percentiles-histogram.[http.server.requests]=true
management.tracing.sampling.probability=0.1

# JSON logs (D29)
logging.structured.format.console=ecs
